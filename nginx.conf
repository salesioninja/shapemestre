# Configuração Nginx para shapemestre.acessaronline.com.br

# Redirecionamento HTTP para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name shapemestre.acessaronline.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS Principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shapemestre.acessaronline.com.br;

    # Certificados SSL (Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/shapemestre.acessaronline.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shapemestre.acessaronline.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Limite de tamanho de upload (para fotos de refeições e áudios de treino)
    client_max_body_size 30M;

    # Compressão GZIP para máxima velocidade
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_proxied any;
    gzip_min_length 1000;

    # Cache agressivo para GIFs e imagens
    location ~* \.(?:gif|jpg|jpeg|png|webp|svg|ico)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy Reverso para a Aplicação Node.js Shape Mestre
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Suporte a WebSocket e Streaming em Tempo Real (SSE)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Desativa buffer para o efeito digitação da IA fluir instantaneamente
        proxy_buffering off;
        proxy_read_timeout 300s;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
