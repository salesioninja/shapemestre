version: '3.8'

services:
  app:
    image: shapemestre:latest
    networks:
      - ninja_net
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-https://whats.acessaronline.com.br}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-Professor}
    volumes:
      - /var/www/shapemestre/server.js:/app/server.js
      - /var/www/shapemestre/services:/app/services
      - /var/www/shapemestre/public:/app/public
      - /var/www/shapemestre/data:/app/data
      - /var/www/shapemestre/gifs:/app/public/assets/gifs
      - /var/www/shapemestre/.env:/app/.env
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=ninja_net"

        # Roteador HTTPS Principal
        - "traefik.http.routers.shapemestre.rule=Host(`shapemestre.acessaronline.com.br`)"
        - "traefik.http.routers.shapemestre.entrypoints=websecure"
        - "traefik.http.routers.shapemestre.tls=true"
        - "traefik.http.routers.shapemestre.tls.certresolver=letsencryptresolver"

        # Porta interna do Node.js
        - "traefik.http.services.shapemestre.loadbalancer.server.port=3000"

        # Redirecionamento HTTP -> HTTPS
        - "traefik.http.routers.shapemestre-http.rule=Host(`shapemestre.acessaronline.com.br`)"
        - "traefik.http.routers.shapemestre-http.entrypoints=web"
        - "traefik.http.routers.shapemestre-http.middlewares=shapemestre-redirect"
        - "traefik.http.middlewares.shapemestre-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.shapemestre-redirect.redirectscheme.permanent=true"

networks:
  ninja_net:
    external: true
